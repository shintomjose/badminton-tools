# Refresh the Team 4 league results from nuLiga after every match day.
# All matches are on Saturdays and nuLiga has the results the next day,
# so this runs Sunday and Monday morning (retry in case nuLiga is late).
# A commit is only created when the results actually changed; the push
# triggers the normal GitHub Pages deployment.
name: Update results

on:
  schedule:
    - cron: "0 7 * * 0,1" # Sun+Mon 07:00 UTC = 08:00/09:00 Berlin
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Fetch and rewrite results.js
        run: node scripts/update-results.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet results.js; then
            echo "results unchanged — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "results-bot"
          git config user.email "actions@github.com"
          git add results.js
          git commit -m "chore(results): update from nuLiga"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # a push made with GITHUB_TOKEN does not trigger the deploy-hosting
      # workflow, so the Firebase sites are deployed from here as well
      - name: Deploy Firebase Hosting
        if: steps.commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BADMINTON_TOOLS_C6B27 }}
          projectId: badminton-tools-c6b27
          channelId: live
